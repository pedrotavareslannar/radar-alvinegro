<!-- @dsCard group="Colors" viewport="700x180" name="Core palette" subtitle="Preto, branco, ouro — the alvinegro base plus the single gold accent" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-base); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .sw { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); }
  .chip { height: 84px; }
  .meta { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
  .name { font: var(--weight-semibold) 14px/1.2 var(--font-sans); color: var(--text-strong); }
  .hex { font: var(--weight-regular) 12px/1.4 var(--font-sans); color: var(--text-muted); letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw">
      <div class="chip" style="background:var(--preto); border-bottom:1px solid var(--border);"></div>
      <div class="meta"><span class="name">Preto</span><span class="hex">#0D0D0D · --preto</span></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:var(--branco);"></div>
      <div class="meta"><span class="name">Branco</span><span class="hex">#FFFFFF · --branco</span></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:var(--ouro);"></div>
      <div class="meta"><span class="name">Ouro</span><span class="hex">#F5C800 · --ouro</span></div>
    </div>
  </div>
</body>
</html>
