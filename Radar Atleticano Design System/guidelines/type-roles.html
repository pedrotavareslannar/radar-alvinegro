<!-- @dsCard group="Type" viewport="700x270" name="Editorial roles" subtitle="Kicker, headline, card title, body, meta — the journalistic hierarchy" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-base); display:flex; flex-direction:column; gap:12px; }
  .kicker { font: var(--weight-bold) var(--text-xs)/1.2 var(--font-sans); text-transform:uppercase; letter-spacing:var(--tracking-widest); color: var(--accent); }
  .headline { font: var(--weight-bold) var(--text-4xl)/var(--leading-tight) var(--font-sans); letter-spacing: var(--tracking-tight); color: var(--text-strong); margin:2px 0; }
  .body { font: var(--type-body); color: var(--text-secondary); max-width: 60ch; }
  .meta { font: var(--type-meta); color: var(--text-muted); display:flex; gap:8px; }
  .meta b { color: var(--text-secondary); font-weight: var(--weight-medium); }
</style>
</head>
<body>
  <span class="kicker">Bastidores</span>
  <h1 class="headline">A reconstrução do elenco sob a nova SAF</h1>
  <p class="body">Análise objetiva, com separação clara entre fato, rumor e opinião — o padrão editorial que diferencia o portal.</p>
  <div class="meta"><b>Redação</b><span>·</span><span>09 de junho de 2026</span></div>
</body>
</html>
