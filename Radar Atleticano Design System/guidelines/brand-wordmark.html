<!-- @dsCard group="Brand" viewport="700x150" name="Logo — wordmark" subtitle="Gold bar + uppercase Inter Bold wordmark. The primary lockup" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px; background: var(--surface-base); display:flex; align-items:center; gap:40px; }
  .lockup { display:flex; align-items:center; gap:12px; }
  .bar { width:8px; height:32px; background:var(--ouro); border-radius:var(--radius-sm); }
  .wm { font: var(--weight-bold) 26px/1 var(--font-sans); letter-spacing: var(--tracking-tight); text-transform:uppercase; color: var(--text-strong); }
  .alt { background: var(--branco); padding:16px 18px; border-radius: var(--radius-md); }
  .alt .wm { color: var(--preto); }
</style>
</head>
<body>
  <div class="lockup"><span class="bar"></span><span class="wm">Radar Atleticano</span></div>
  <div class="alt"><div class="lockup"><span class="bar"></span><span class="wm">Radar Atleticano</span></div></div>
</body>
</html>
