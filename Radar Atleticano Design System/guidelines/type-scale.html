<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="xs 12 → 5xl 48. Tailwind-derived steps used across the portal" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-base); }
  .r { display:flex; align-items:baseline; gap:16px; padding:5px 0; border-bottom:1px solid var(--branco-05); }
  .r:last-child { border-bottom:0; }
  .tag { width:56px; flex-shrink:0; font: var(--weight-medium) 11px/1.2 var(--font-sans); color: var(--text-muted); }
  .ex { color: var(--text-strong); font-weight: var(--weight-bold); white-space:nowrap; }
</style>
</head>
<body>
  <div class="r"><span class="tag">5xl · 48</span><span class="ex" style="font-size:var(--text-5xl)">Manchete</span></div>
  <div class="r"><span class="tag">3xl · 30</span><span class="ex" style="font-size:var(--text-3xl)">Título de matéria</span></div>
  <div class="r"><span class="tag">2xl · 24</span><span class="ex" style="font-size:var(--text-2xl)">Seção / wordmark</span></div>
  <div class="r"><span class="tag">xl · 20</span><span class="ex" style="font-size:var(--text-xl)">Card em destaque</span></div>
  <div class="r"><span class="tag">lg · 18</span><span class="ex" style="font-size:var(--text-lg)">Card padrão</span></div>
  <div class="r"><span class="tag">base · 16</span><span class="ex" style="font-size:var(--text-base); font-weight:var(--weight-regular)">Corpo de texto</span></div>
  <div class="r"><span class="tag">sm · 14</span><span class="ex" style="font-size:var(--text-sm); font-weight:var(--weight-regular)">Resumo, navegação</span></div>
  <div class="r"><span class="tag">xs · 12</span><span class="ex" style="font-size:var(--text-xs); font-weight:var(--weight-regular)">Data, autoria, kicker</span></div>
</body>
</html>
