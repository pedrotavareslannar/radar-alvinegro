<!-- @dsCard group="Colors" viewport="700x150" name="White alpha ramp" subtitle="The whole UI is translucent white over #0D0D0D — borders, meta, body" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-base); }
  .ramp { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cell { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .box { height: 60px; border-radius: var(--radius-sm); border: 1px solid var(--branco-10); }
  .lbl { font: var(--weight-medium) 11px/1.3 var(--font-sans); color: var(--text-secondary); text-align: center; }
  .val { font: var(--weight-regular) 10px/1.3 var(--font-sans); color: var(--text-muted); text-align: center; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="cell"><div class="box" style="background:var(--branco-90)"></div><span class="lbl">90</span><span class="val">strong</span></div>
    <div class="cell"><div class="box" style="background:var(--branco-70)"></div><span class="lbl">70</span><span class="val">nav</span></div>
    <div class="cell"><div class="box" style="background:var(--branco-60)"></div><span class="lbl">60</span><span class="val">secondary</span></div>
    <div class="cell"><div class="box" style="background:var(--branco-40)"></div><span class="lbl">40</span><span class="val">muted</span></div>
    <div class="cell"><div class="box" style="background:var(--branco-20)"></div><span class="lbl">20</span><span class="val">—</span></div>
    <div class="cell"><div class="box" style="background:var(--branco-10)"></div><span class="lbl">10</span><span class="val">border</span></div>
    <div class="cell"><div class="box" style="background:var(--branco-05)"></div><span class="lbl">05</span><span class="val">wash</span></div>
  </div>
</body>
</html>
