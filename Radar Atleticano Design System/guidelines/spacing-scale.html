<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid. Card padding 20, grid gap 24, section gap 32" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-base); }
  .row { display:flex; align-items:flex-end; gap:18px; }
  .u { display:flex; flex-direction:column; gap:8px; align-items:center; }
  .bar { background: var(--ouro); border-radius: 2px; width: 100%; }
  .u .lbl { font: var(--weight-medium) 11px/1.2 var(--font-sans); color: var(--text-secondary); }
  .u .px { font: var(--weight-regular) 10px/1.2 var(--font-sans); color: var(--text-muted); }
  .wrap { display:flex; align-items:flex-end; height:64px; }
</style>
</head>
<body>
  <div class="row">
    <div class="u"><div class="wrap"><div class="bar" style="height:4px"></div></div><span class="lbl">1</span><span class="px">4</span></div>
    <div class="u"><div class="wrap"><div class="bar" style="height:8px"></div></div><span class="lbl">2</span><span class="px">8</span></div>
    <div class="u"><div class="wrap"><div class="bar" style="height:12px"></div></div><span class="lbl">3</span><span class="px">12</span></div>
    <div class="u"><div class="wrap"><div class="bar" style="height:16px"></div></div><span class="lbl">4</span><span class="px">16</span></div>
    <div class="u"><div class="wrap"><div class="bar" style="height:20px"></div></div><span class="lbl">5</span><span class="px">20</span></div>
    <div class="u"><div class="wrap"><div class="bar" style="height:24px"></div></div><span class="lbl">6</span><span class="px">24</span></div>
    <div class="u"><div class="wrap"><div class="bar" style="height:32px"></div></div><span class="lbl">8</span><span class="px">32</span></div>
    <div class="u"><div class="wrap"><div class="bar" style="height:40px"></div></div><span class="lbl">10</span><span class="px">40</span></div>
    <div class="u"><div class="wrap"><div class="bar" style="height:48px"></div></div><span class="lbl">12</span><span class="px">48</span></div>
    <div class="u"><div class="wrap"><div class="bar" style="height:64px"></div></div><span class="lbl">16</span><span class="px">64</span></div>
  </div>
</body>
</html>
