<!-- @dsCard group="Brand" viewport="700x160" name="Logo — mark & favicon" subtitle="Compact RA monogram with the gold bar, for avatars and favicons" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-base); display:flex; align-items:center; gap:28px; }
  .mark { display:flex; align-items:center; justify-content:flex-start; gap:6px; background:var(--preto); border:1px solid var(--border); border-radius:var(--radius-md); padding:0 16px; }
  .bar { background:var(--ouro); border-radius:var(--radius-sm); }
  .mono { font-family:var(--font-sans); font-weight:var(--weight-extrabold); letter-spacing:-0.04em; color:var(--text-strong); }
  .cap { font: var(--weight-regular) 11px/1.3 var(--font-sans); color: var(--text-muted); }
  .item { display:flex; flex-direction:column; gap:8px; align-items:center; }
</style>
</head>
<body>
  <div class="item">
    <div class="mark" style="height:96px; border-radius:18px;"><span class="bar" style="width:10px;height:48px"></span><span class="mono" style="font-size:42px">RA</span></div>
    <span class="cap">96 — app icon</span>
  </div>
  <div class="item">
    <div class="mark" style="height:64px;"><span class="bar" style="width:7px;height:32px"></span><span class="mono" style="font-size:28px">RA</span></div>
    <span class="cap">64 — avatar</span>
  </div>
  <div class="item">
    <div class="mark" style="height:32px; padding:0 8px; gap:4px;"><span class="bar" style="width:4px;height:16px"></span><span class="mono" style="font-size:15px">RA</span></div>
    <span class="cap">32 — favicon</span>
  </div>
</body>
</html>
